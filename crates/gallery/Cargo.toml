[package]
name = "gpui-antd-gallery"
version = "0.1.0"
publish = false
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gpui-antd-gallery"
path = "src/main.rs"

[dependencies]
gpui-antd = { path = "../antd" }
gpui-kit.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
