name: Build and deploy GPUI Ant Design

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR checks cannot cancel in-flight production builds or Pages deploys.
  # Subsequent pushes to main still supersede older main deployments.
  group: gpui-antd-pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: true

jobs:
  wasm-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust nightly for GPUI Web
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-gallery

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Build the actual Rust GPUI gallery to WebAssembly
        run: bash scripts/build-wasm.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install docs dependencies
        working-directory: website
        run: npm install --no-audit --no-fund

      - name: Build documentation and gallery
        working-directory: website
        run: npm run build

      - name: Verify WASM is included
        run: |
          test -f website/dist/index.html
          test -f website/dist/demo.html
          find website/dist -name '*.wasm' -print | grep -q . || { echo "WASM missing from Pages artifact"; exit 1; }

      - name: Smoke test real WASM rendering in Chromium
        timeout-minutes: 14
        working-directory: website
        run: |
          npx playwright install --with-deps chromium
          npm run smoke

      - name: Audit real GPUI icon glyphs at catalog boundaries
        timeout-minutes: 10
        working-directory: website
        run: npm run audit:icons -- --sample

      - name: Archive icon audit mosaics and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-antd-icon-audit
          path: ${{ runner.temp }}/gpui-antd-icon-audit
          if-no-files-found: ignore
          retention-days: 7

      - name: Archive smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-antd-browser-smoke
          path: ${{ runner.temp }}/gpui-antd-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Archive built site for CI review
        uses: actions/upload-artifact@v4
        with:
          name: gpui-antd-wasm-site
          path: website/dist
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: wasm-and-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate GitHub Pages configuration
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
