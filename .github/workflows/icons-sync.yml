name: Sync official Ant Design Icons
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_antd_icons.py'
      - '.github/workflows/icons-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpui-antd-icons-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout with push credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch exact pinned upstream SVG revision
        shell: bash
        run: |
          set -euxo pipefail
          upstream="$RUNNER_TEMP/ant-design-icons"
          mkdir -p "$upstream"
          git -C "$upstream" init
          git -C "$upstream" fetch --depth 1 https://github.com/ant-design/ant-design-icons.git 7f2516ac91226d2b41f93b35cb5197c8d94f7189
          git -C "$upstream" checkout --detach FETCH_HEAD

      - name: Generate full Rust icon registry and embedded assets
        shell: bash
        run: python3 scripts/sync_antd_icons.py --upstream "$RUNNER_TEMP/ant-design-icons"

      - name: Commit pinned generated icons and manifest
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/antd/assets/antd-icons crates/antd/src/icons.rs website/public/antd-icons.json
          if git diff --cached --quiet; then
            echo "Complete icon catalog already synchronized."
          else
            git commit -m "chore(icons): vendor full pinned Ant Design SVG catalog"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
