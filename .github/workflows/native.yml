name: Native crate CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ clang pkg-config libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libvulkan1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-gallery
      - name: Check component library and gallery
        run: cargo check --workspace
      - name: Component library unit tests
        run: cargo test -p gpui-antd --lib
      - name: Component pointer and keyboard regressions
        run: cargo test -p gpui-antd --test control_interactions --test menu_hover
      - name: Gallery URL and preview option tests
        run: cargo test -p gpui-antd-gallery --lib
