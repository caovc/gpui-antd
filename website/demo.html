<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>GPUI Ant Design — Rust/WASM Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; font: 13px system-ui, sans-serif; }
    body.dark { background: #141414; color: #f4f4f4; }
    #status { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); color: #8c8c8c; text-align: center; width: 85%; z-index: 2; }
    #status .spinner { width: 26px; height: 26px; border: 3px solid #e6f4ff; border-top-color: #1677ff; border-radius: 100%; animation: spin 800ms linear infinite; margin: 0 auto 12px; }
    #status.error { color: #cf1322; }
    body > canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="status" role="status" aria-live="polite"><div class="spinner"></div><span>Starting GPUI WebAssembly…</span></div>
  <script type="module" src="./src/demo.js"></script>
</body>
</html>
